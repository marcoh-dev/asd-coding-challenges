info:
  name: Search characters by name
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseURL}}/api/characters?name=rick"
  params:
    - name: name
      value: rick
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.results[0].name
      operator: contains
      value: Rick

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
