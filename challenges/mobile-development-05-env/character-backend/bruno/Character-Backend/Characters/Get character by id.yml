info:
  name: Get character by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/api/characters/:id"
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.name
      operator: eq
      value: Rick Sanchez

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
