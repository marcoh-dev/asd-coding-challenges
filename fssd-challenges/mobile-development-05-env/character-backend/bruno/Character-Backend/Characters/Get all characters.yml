info:
  name: Get all characters
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/characters?page=1&limit=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.results
      operator: isArray
      value: ""
    - expression: res.body.info.count
      operator: isNumber
      value: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
