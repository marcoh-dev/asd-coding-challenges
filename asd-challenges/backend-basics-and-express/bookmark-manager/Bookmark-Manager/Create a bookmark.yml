info:
  name: Create a bookmark
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/bookmarks"
  body:
    type: json
    data: |2-
      
        {
          "url": "https://www.google.com",
          "title": "Google",
          "tag": "Search Engine"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
