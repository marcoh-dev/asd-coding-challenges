info:
  name: Get all threads
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/threads?page=1&limit=10&startDate=2026-08-22&sort=createdAt"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: startDate
      value: 2026-08-22
      type: query
    - name: sort
      value: createdAt
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
